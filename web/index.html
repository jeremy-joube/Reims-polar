<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Planificateur Reims Polar 2026"
    >

    <title>REIMS POLAR — Planner 2026</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>

<body>

    <!-- ======================================================
         HEADER
    ======================================================= -->

    <header class="site-header">

        <div class="header-inner">

            <div class="brand">

                <span class="brand-small">
                    REIMS POLAR
                </span>

                <h1>
                    PLANNER
                </h1>

                <span class="brand-year">
                    2026
                </span>

            </div>


            <div class="header-stats">

                <div class="header-stat">

                    <span
                        id="selected-films-count"
                        class="header-stat-number"
                    >
                        0
                    </span>

                    <span class="header-stat-label">
                        films
                    </span>

                </div>


                <div class="header-stat">

                    <span
                        id="selected-sessions-count"
                        class="header-stat-number"
                    >
                        0
                    </span>

                    <span class="header-stat-label">
                        séances
                    </span>

                </div>

            </div>

        </div>

    </header>


    <!-- ======================================================
         NAVIGATION
    ======================================================= -->

    <nav class="main-navigation">

        <div class="navigation-inner">

            <button
                type="button"
                class="nav-button active"
                data-view="catalogue"
            >
                Catalogue
            </button>


            <button
                type="button"
                class="nav-button"
                data-view="planning"
            >
                Mon planning
            </button>

        </div>

    </nav>


    <!-- ======================================================
         MAIN
    ======================================================= -->

    <main class="main-content">


        <!-- ==================================================
             CATALOGUE
        =================================================== -->

        <section
            id="catalogue-view"
            class="page-view active"
        >

            <div class="section-header">

                <div>

                    <span class="section-kicker">
                        PROGRAMME 2026
                    </span>

                    <h2>
                        Catalogue
                    </h2>

                    <p>
                        Sélectionnez les films que vous souhaitez
                        intégrer à votre planning.
                    </p>

                </div>

            </div>


            <div class="catalogue-controls">

                <div class="search-wrapper">

                    <input
                        type="search"
                        id="film-search"
                        class="search-input"
                        placeholder="Rechercher un film..."
                        autocomplete="off"
                    >

                </div>


                <div
                    id="category-filters"
                    class="category-filters"
                >
                </div>

            </div>


            <div
                id="film-grid"
                class="film-grid"
            >
            </div>

        </section>


        <!-- ==================================================
             PLANNING
        =================================================== -->

        <section
            id="planning-view"
            class="page-view"
        >

            <div class="section-header">

                <div>

                    <span class="section-kicker">
                        VOTRE PROGRAMME
                    </span>

                    <h2>
                        Mon planning
                    </h2>

                    <p>
                        Retrouvez ici toutes les séances
                        des films sélectionnés.
                    </p>

                </div>


                <button
                    type="button"
                    id="clear-selection"
                    class="danger-button"
                >
                    Tout effacer
                </button>

            </div>


            <div
                id="conflict-alert"
                class="conflict-alert hidden"
            >
            </div>


            <div
                id="planning-content"
                class="planning-content"
            >
            </div>

        </section>

    </main>


    <!-- ======================================================
         MODAL FILM
    ======================================================= -->

    <div
        id="film-modal"
        class="modal"
    >

        <div class="modal-overlay"></div>


        <div class="modal-dialog">

            <button
                type="button"
                class="modal-close"
                data-close-modal
                aria-label="Fermer"
            >
                ×
            </button>


            <div class="modal-header">

                <span
                    id="modal-film-category"
                    class="film-category"
                >
                </span>

                <h2 id="modal-film-title">
                </h2>

                <span
                    id="modal-film-duration"
                    class="modal-duration"
                >
                </span>

            </div>


            <div class="modal-body">

                <h3>
                    Séances
                </h3>

                <div
                    id="modal-film-sessions"
                    class="modal-sessions"
                >
                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    id="modal-select-film"
                    class="primary-button"
                >
                    Ajouter au planning
                </button>


                <button
                    type="button"
                    class="secondary-button"
                    data-close-modal
                >
                    Fermer
                </button>

            </div>

        </div>

    </div>


    <!-- ======================================================
         SCRIPTS
    ======================================================= -->

    <script src="./js/planner.js"></script>
    <script src="./js/app.js"></script>

</body>

</html>
